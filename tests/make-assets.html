<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>AiVoid asset generator</title>
  <style>
    body { margin: 24px; font: 14px/1.5 system-ui, sans-serif; background: #222; color: #eee; }
    canvas { display: block; margin: 12px 0 24px; max-width: 100%; height: auto; background: #000; }
    .row { display: flex; gap: 16px; align-items: flex-end; flex-wrap: wrap; }
  </style>
</head>
<body>
  <!-- Renders the share card and icons and saves them to public/assets through
       the dev server (php -S localhost:5173 -t public tests/router.php). Reload to regenerate. -->
  <h1 id="status">Rendering…</h1>
  <div id="out"></div>
  <script>
  (async function () {
    const FONT = '-apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif';
    const MONO = 'ui-monospace, "SF Mono", Consolas, monospace';
    const BLUE = '#2997ff';
    const out = document.getElementById('out');

    function canvas(w, h) {
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      return c;
    }

    // Seeded random so the card renders the same every time.
    let seed = 11;
    const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);

    function drawHorizon(ctx, cx, cy, r0, opts = {}) {
      const tilt = 0.34, rot = -0.2;
      const proj = (r, t) => {
        const x = r * Math.cos(t), y = r * Math.sin(t) * tilt;
        return [cx + x * Math.cos(rot) - y * Math.sin(rot), cy + x * Math.sin(rot) + y * Math.cos(rot)];
      };
      ctx.strokeStyle = 'rgba(255,255,255,0.12)';
      ctx.lineWidth = Math.max(1, r0 / 60);
      for (const f of [1.55, 2.15]) { ctx.beginPath(); ctx.arc(cx, cy, r0 * f, 0, Math.PI * 2); ctx.stroke(); }

      const parts = Array.from({ length: opts.particles || 260 }, () => ({
        r: r0 * (1.35 + rnd() * 2.6), t: rnd() * Math.PI * 2, s: 0.6 + rnd() * 1.6, a: 0.25 + rnd() * 0.7, blue: rnd() < 0.18,
      }));
      const drawParts = (front) => {
        for (const p of parts) {
          const behind = Math.sin(p.t) < 0;
          if (behind === front) continue;
          const far = 1 - Math.min(1, p.r / (r0 * 4));
          ctx.globalAlpha = p.a * (0.35 + far * 0.65) * (behind ? 0.55 : 1);
          ctx.strokeStyle = p.blue ? BLUE : '#f5f5f7';
          ctx.lineCap = 'round';
          ctx.lineWidth = p.s * (r0 / 70);
          const [x0, y0] = proj(p.r, p.t - Math.min(0.5, 6 / Math.pow(p.r / r0, 1.5) * 0.06));
          const [x1, y1] = proj(p.r, p.t);
          ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
        }
        ctx.globalAlpha = 1;
      };
      drawParts(false);

      const g = ctx.createConicGradient ? ctx.createConicGradient(2.2, cx, cy) : BLUE;
      if (g.addColorStop) {
        g.addColorStop(0, BLUE); g.addColorStop(0.35, 'rgba(41,151,255,0)');
        g.addColorStop(0.65, 'rgba(41,151,255,0)'); g.addColorStop(1, BLUE);
      }
      ctx.strokeStyle = g;
      ctx.lineWidth = Math.max(2, r0 / 28);
      ctx.beginPath(); ctx.arc(cx, cy, r0 * 1.14, 0, Math.PI * 2); ctx.stroke();

      ctx.fillStyle = '#000';
      ctx.beginPath(); ctx.arc(cx, cy, r0, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#f5f5f7';
      ctx.lineWidth = Math.max(1.5, r0 / 40);
      ctx.stroke();
      drawParts(true);
    }

    function chip(ctx, text, x, y, scale, alpha, angle) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle);
      ctx.scale(scale * 1.25, scale * 0.8);
      ctx.rotate(-angle);
      ctx.globalAlpha = alpha;
      ctx.font = `500 20px ${MONO}`;
      const w = ctx.measureText(text).width + 30, h = 40;
      ctx.fillStyle = '#1d1d1f';
      ctx.strokeStyle = 'rgba(255,255,255,0.16)';
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.roundRect(-w / 2, -h / 2, w, h, 20); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#a1a1a6';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(text, 0, 1);
      ctx.restore();
    }

    function mark(ctx, x, y, size) {
      ctx.strokeStyle = 'rgba(255,255,255,0.35)';
      ctx.lineWidth = size * 0.06;
      ctx.beginPath(); ctx.arc(x, y, size * 0.43, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = '#000';
      ctx.strokeStyle = '#f5f5f7';
      ctx.lineWidth = size * 0.065;
      ctx.beginPath(); ctx.arc(x, y, size * 0.27, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    }

    const logo = await new Promise((res) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => res(null); i.src = '/assets/sli-logo.svg'; });

    /* ---- share card 1200x630 ---- */
    const og = canvas(1200, 630);
    {
      const ctx = og.getContext('2d');
      const bg = ctx.createRadialGradient(880, 300, 40, 880, 300, 760);
      bg.addColorStop(0, '#0d0f14'); bg.addColorStop(1, '#000');
      ctx.fillStyle = bg; ctx.fillRect(0, 0, 1200, 630);
      for (let i = 0; i < 220; i++) {
        ctx.globalAlpha = 0.05 + rnd() * 0.22;
        ctx.fillStyle = '#fff';
        ctx.fillRect(rnd() * 1200, rnd() * 630, 1.6, 1.6);
      }
      ctx.globalAlpha = 1;

      drawHorizon(ctx, 900, 300, 92, { particles: 320 });
      chip(ctx, 'C2PA · ChatGPT', 690, 150, 0.95, 0.9, Math.atan2(300 - 150, 900 - 690));
      chip(ctx, 'GPS 37.77, -122.41', 1090, 470, 0.9, 0.85, Math.atan2(300 - 470, 900 - 1090));
      chip(ctx, 'prompt: astronaut cat', 760, 455, 0.6, 0.55, Math.atan2(300 - 455, 900 - 760));
      chip(ctx, 'Seed: 2875531', 1080, 140, 0.7, 0.65, Math.atan2(300 - 140, 900 - 1080));

      mark(ctx, 98, 92, 40);
      ctx.fillStyle = '#f5f5f7';
      ctx.font = `600 32px ${FONT}`;
      ctx.textBaseline = 'middle';
      ctx.fillText('AiVoid', 130, 93);

      ctx.textBaseline = 'alphabetic';
      ctx.font = `700 70px ${FONT}`;
      ctx.fillText('Strip the AI tags', 78, 268);
      ctx.fillText('from your images.', 78, 350);

      ctx.fillStyle = '#a1a1a6';
      ctx.font = `400 28px ${FONT}`;
      ctx.fillText('Free. Runs in your browser. No uploads.', 80, 412);

      ctx.fillStyle = '#f5f5f7';
      ctx.font = `600 24px ${FONT}`;
      ctx.fillText('aivoid.shinelabsinnovations.com', 80, 552);
      if (logo) {
        ctx.drawImage(logo, 80, 572, 40, 23);
        ctx.fillStyle = '#a1a1a6';
        ctx.font = `400 19px ${FONT}`;
        ctx.fillText('by Shine Labs Innovations', 130, 591);
      }
    }

    /* ---- icons ---- */
    function icon(size, rounded) {
      const c = canvas(size, size);
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#000';
      if (rounded) { ctx.beginPath(); ctx.roundRect(0, 0, size, size, size * 0.22); ctx.fill(); }
      else ctx.fillRect(0, 0, size, size);
      const s = size * (rounded ? 1 : 0.86);
      ctx.strokeStyle = 'rgba(255,255,255,0.35)';
      ctx.lineWidth = Math.max(1, s * 0.031);
      ctx.beginPath(); ctx.arc(size / 2, size / 2, s * 0.33, 0, Math.PI * 2); ctx.stroke();
      if (size >= 128) {
        ctx.strokeStyle = BLUE;
        ctx.lineWidth = s * 0.02;
        ctx.beginPath(); ctx.arc(size / 2, size / 2, s * 0.255, -2.6, -0.4); ctx.stroke();
      }
      ctx.fillStyle = '#000';
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = Math.max(1.5, s * 0.04);
      ctx.beginPath(); ctx.arc(size / 2, size / 2, s * 0.225, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      return c;
    }

    const files = [
      ['og.jpg', og],
      ['icon-512.png', icon(512, false)],
      ['icon-192.png', icon(192, false)],
      ['apple-touch-icon.png', icon(180, false)],
      ['icon-32.png', icon(32, true)],
    ];
    const row = document.createElement('div');
    row.className = 'row';
    for (const [name, c] of files) {
      const jpg = name.endsWith('.jpg');
      const blob = await new Promise((r) => c.toBlob(r, jpg ? 'image/jpeg' : 'image/png', jpg ? 0.88 : undefined));
      const res = await fetch('/__asset?name=' + name, { method: 'POST', body: blob });
      const p = document.createElement('p');
      p.textContent = `${name} ${c.width}×${c.height} · ${(blob.size / 1024).toFixed(1)} KB · ${res.status === 204 ? 'saved' : 'FAILED ' + res.status}`;
      (name === 'og.jpg' ? out : row).append(p, c);
    }
    out.appendChild(row);
    document.getElementById('status').textContent = 'Done';
  })();
  </script>
</body>
</html>
